# Serves the SPA and reverse-proxies /api to the backend on the same origin,
# so the refresh cookie can stay SameSite=Strict and no CORS is required.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CoinGecko serves coin thumbnails; everything else is same-origin.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://coin-images.coingecko.com https://assets.coingecko.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 256k;   # CSV imports
    # Server-Sent Events (live pipeline timeline): stream, don't buffer.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Metrics stay internal: never exposed through the public proxy.
  location /metrics { return 404; }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
