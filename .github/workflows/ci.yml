name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: lodestar, POSTGRES_PASSWORD: lodestar, POSTGRES_DB: lodestar_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lodestar" --health-interval 5s --health-retries 10
    env:
      LS_ENV: test
      LS_DATABASE_URL: postgresql+asyncpg://lodestar:lodestar@localhost:5432/lodestar_test
      LS_TEST_DATABASE_URL: postgresql+asyncpg://lodestar:lodestar@localhost:5432/lodestar_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: Lint & format
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Type check (strict)
        run: uv run mypy src
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests
        run: uv run pytest --cov --cov-report=xml --cov-fail-under=80
      - name: Dependency audit
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/req.txt && uv run pip-audit -r /tmp/req.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  stack:
    name: docker stack + acceptance smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build
      - name: Start the stack (no keys -> demo mode)
        run: docker compose up -d
      - name: Acceptance smoke test (dashboard, POL report, add coin -> verified report, exports, scanner -> trade plan, backtest, paper)
        run: ./scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=200 migrate api worker
      - name: Stop
        if: always()
        run: docker compose down -v
      - name: Scan images for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
