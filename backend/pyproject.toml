[project]
name = "lodestar"
version = "0.2.0"
description = "Personal, read-only crypto portfolio analysis with an evidence-grounded agentic pipeline"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.162.2",
  "uvicorn[standard]>=0.54.0",
  "pydantic[email]>=2.14.3",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.1.8",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=8.1.0",
  "celery[redis]>=5.7.0",
  "langgraph>=1.2.20",
  "langgraph-checkpoint-postgres>=3.2",
  "psycopg[binary,pool]>=3.3.8",
  "fpdf2>=2.8",
  "httpx>=0.28",
  "anthropic>=2.7.0",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "cryptography>=44",
  "defusedxml>=0.7",
  "structlog>=24.4",
  "prometheus-fastapi-instrumentator>=7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.17.4",
  "mypy>=1.13",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lodestar"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "BLE", "A", "C4", "SIM", "RUF", "ASYNC", "PL", "PT"]
ignore = ["A002", "N818", "PLR0917", "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lodestar.interfaces.workers.tasks"]
disallow_untyped_decorators = false  # Celery's task decorator is untyped

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/lodestar"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
